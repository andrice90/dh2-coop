; dh2coop.asi configuration (lives next to the ASI in game\Bin)
[General]
LogLevel=info
; module wait poll interval (ms) and give-up timeout (ms)
PollMs=50
ModuleWaitTimeoutMs=180000

[Probe]
; Pass-through logging into dh2coop.log. Event sources (Present, map load, DLL load) stay on either way.
Enabled=0
HookD3D=1
HookNet=1
HookMap=1
HookConsole=1
; log engine static state once per second for this many seconds
StateSeconds=20

[Coop]
; Rename "GI UNIQUE MUTEX" to include the pid so two instances can run on one PC.
AllowMultiInstance=1
; Keep simulating when the window loses focus (cApplication::m_bAllowBackground). Required for hosting.
AllowBackground=1
; Keyboard and mouse reach this process only while its game window is in front.
; Local multi-window tests share one keyboard; on two PCs this changes nothing visible.
InputOnlyWhenFocused=1
; Block cHUDSlowMotion::Enable and reset `frametime 1` on map load (co-op policy: no slow motion).
DisableSlowMo=1
; UDP port for coop_host / coop_join, and the name shown to other players.
Port=27420
PlayerName=Hunter
; Start a session by itself once the first map (the menu) loads: off | host | join.
; Friends: the host sets AutoRole=host; everyone else sets AutoRole=join and JoinAddress to the host's IP
; (host[:port]). A joiner retries every JoinRetrySeconds while offline, then follows the host's maps.
; The command-line switches -coophost / -coopjoin <addr> override this.
AutoRole=off
JoinAddress=127.0.0.1
JoinRetrySeconds=5
; Starting the map that is already loaded (results-screen replay, a host replay the clients follow) does the
; normal map-change cleanup and a full load. The engine's own same-map shortcut leaves the next teardown to crash
; in cSndDrvDS::WaveRelease, with or without this mod (re/notes/replay-crash.md). 0 = engine behavior.
FullReloadOnReplay=1

; Helicopter maps (MAP11A / MAP11C): clients fly their copy of the helicopter at the host's clip and clip time.
; 0 = every machine flies its own copy from the replayed story (the drift is still logged as "heli: drift").
HeliSync=1

[Overlay]
; In-game status overlay (Dear ImGui on the D3D8 device). F8 toggles it while the game window has focus.
Enabled=1
; Markers over other players (and an edge arrow when they are off screen). F7 toggles them; F8 does not.
Markers=1
; Solo check: also draw grey markers on animals (entity +0xE8). Leave 0 for play.
MarkerTest=0

[Puppets]
; One third-person human per remote player, driven by interpolated network state (Phase 3).
Enabled=1
; Entity class for puppets (see game\Bin\dh2coop-classes.txt). obj_humanEx = generic human without AI.
Class=obj_humanEx
; Puppet body. The player's own model is first-person arms only, so use a full NPC skin + its animation pack.
; "hunter" = the local player's model (arms only, effectively invisible).
Model=objects/npc/mountainguide/mountainguide.skin,game.ap,shotgun1.ap,handgun3.ap
; Clip while the remote player crouches (NPC bodies have no crouch-walk clip). Candidates: coveridle, cover, crouchidlecar, hurtsit.
CrouchClip=coveridle
; Milliseconds the fire clip plays per shot.
FireMs=600
; Switch puppet clips (idlenormalneutral / walk forward|backward|left|right / run/forward) by velocity vs facing.
Animate=1
; 1 = keep the puppet's physics body (no collision with characters, placed by its centre) so animals can attack
; it. 0 = drop the body (puppets are pure visuals; animals then ignore client players).
Physics=1
; Host: animals choose the nearest player, clients included, and what an animal does to a puppet (hurt,
; knockdown) lands on that player's own hunter. Needs Physics=1. User-verified 2026-10-17 on MAP3B.
AttackTarget=1
; Manual trim (metres) for where a Physics=1 puppet is drawn; the body's half height is applied already.
; Console: coop_physy <metres> to try values live.
PhysicsKeyY=0
; Metres added to the networked hunter y (hunter position is the feet, so 0).
YOffset=0
; Debug: spawn one local test puppet that walks a circle in front of the hunter.
Spike=0
; With Spike=1, hold this weapon kind (net::WeaponKind) and fire every 3 s. 0 = no weapon.
; 1 handgun3, 2 shotgun1, 3 rifle1, 5 bolt-action rifle2, 6 handgun5.
SpikeWeapon=0

[Animals]
; Log each body-state change, and (while a session is up) one position line per animal every 2 s.
LogStates=1
; Position lines while hosting or joined. Set 0 to quiet a play session.
SyncLog=1
; Solo experiment only: drive one deer in a circle. Ignored while a co-op session is active.
; SpikeUnlink=1 drops physics (the deer is then not drawn). The sync path keeps physics.
Spike=0
SpikeUnlink=1
; Metres added to the hunter's feet for the spike deer's height.
SpikeYOffset=0.7
; Clients mirror the host in the pre-render callback (HandleKey position/angle, 100 ms interpolation).
; No ini key: the delay matches player snapshots.
; Death and map completion are reliable GameEvents (host commits). No ini key.

[Combat]
; Players knock each other over (the map's animal sync-attack clip, then the get-up). A shot whose aim passes
; another player's body, or a melee swing (SecFire) within 2 m in front. No damage.
KnockOnShot=1
KnockOnMelee=1
; How long a player's knock keeps the victim down before the get-up (ms).
KnockMs=2600

[Scale]
; Player-count difficulty for story fights (host decides; re/notes/scale.md). extra = players - 1.
; Health: a boss (MakeBoss: yeti, hogzilla, big grim) or one large animal attacking alone keeps one body
; and gets max and current health x (1 + 0.25 * extra). A join or leave rescales by ratio (no refill, no heal).
Health=1
; Bodies: every player adds Reserves parked copies of each pack species at map load (coop_<SPECIES>_<n>);
; while a script animal of that species attacks, the host keeps `extra` of them in the fight. Their deaths do
; not count toward kill tasks. Every player must use the same Bodies and Reserves values (entity ids).
Bodies=1
Reserves=3
; A client gives a reserve the host released the same body reset a script MoveToPos gives (collision back on),
; then freezes its brain again; the host still drives it. 0 leaves the parked body (no collision on clients).
ClientRespawn=1
; Release a reserve again after it died. Off: clients keep a dead animal dead until respawn mirroring exists
; (re/notes/audit-maps-a.md G4), so a reused reserve would attack unseen on their screens.
ReuseKilled=0
; Log waves, releases and health changes (scale: lines). Test commands: coop_scale (state), coop_killshot <id>.
Log=1

[Display]
; Back-buffer size. Width or Height 0 uses the desktop work area (windowed) or the desktop (fullscreen).
; The world keeps square pixels. HorPlus keeps the 4:3 vertical view and adds width on the sides.
; LockHud draws the existing HUD in a centered 4:3 rectangle instead of stretching it.
; HudScalePercent shrinks the compass and ammo around their own centers when the buffer is at least
; HudScaleMinHeight tall (1080p and 1440p). Menus stay at the full 4:3 size.
; CompassFix keeps the turning N/E/S/W ring round on screens that are not 4:3 (it stretched with East forward).
Enabled=1
Width=0
Height=0
Windowed=1
HorPlus=1
LockHud=1
CompassFix=1
HudScalePercent=50
HudScaleMinHeight=1080

[Sound]
; Sound driver diagnostics (re/notes/replay-crash.md). A release of an already freed wave is always logged.
; Trace=1 logs wave loads/frees and waves freed while a driver sound still uses them; 2 logs every reference.
; TraceWave=<name part> adds a call stack to the events of matching waves (e.g. bite1).
Trace=0
TraceWave=

[Console]
; One cConsole::Exec line after the first successful map load. Empty disables.
; Example used by the framework proof: cam_fov 70
ExecAfterMap=
